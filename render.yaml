services:
  - type: web
    name: verdict-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Supabase publishable keys are browser-safe and already ship in the
      # frontend bundle. Pinning it here lets the existing Blueprint upgrade
      # from the Phase 2 service without substituting the service-role key.
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_2vkB4FsDLPYyzjns6qcluw_oFU5QG8f
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://verdict-nu-rouge.vercel.app
      - key: FRONTEND_ORIGIN_REGEX
        value: '^https://verdict-[a-z0-9-]+-response-composer\.vercel\.app$'
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
